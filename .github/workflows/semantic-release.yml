# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Semantic Release"

on: # yamllint disable-line rule:truthy
    push:
        branches:
            - "([0-9])?(.{+([0-9]),x}).x"
            - "main"
            - "next"
            - "next-major"
            - "alpha"
            - "beta"
    workflow_dispatch: # yamllint disable-line rule:empty-values

# Two pushes to a release branch in quick succession start two runs that both check
# out, both run multi-semantic-release, and then both push. The second loses with
# `! [rejected] main -> main (non-fast-forward)`, which is how the lock file refresh
# below has been failing: the release itself publishes, then the commit that keeps
# pnpm-lock.yaml in step with the bumped manifests never lands.
#
# `cancel-in-progress` is deliberately false, unlike the other workflows here. This
# job publishes to npm and pushes tags, so cancelling a run midway can leave some
# packages released and others not. Queue the second run behind the first instead.
concurrency:
    group: "${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: false

permissions:
    id-token: "write" # Required for OIDC
    contents: "read" # for checkout

jobs:
    semantic-release:
        name: "Semantic Release"
        if: "github.repository == 'visulima/packem'"
        runs-on: "ubuntu-latest"
        permissions:
            contents: "write" # to be able to publish a GitHub release
            issues: "write" # to be able to comment on released issues
            pull-requests: "write" # to be able to comment on released pull requests
            id-token: "write" # to enable use of OIDC for npm provenance

        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Wait for workflows to succeed"
              uses: "lewagon/wait-on-check-action@1d57e2c51a58d812d2765e036a028b6bdb5a6154" # v1.8.1
              timeout-minutes: 20
              with:
                  ref: "${{ github.event.pull_request.head.sha || github.sha }}"
                  repo-token: "${{ secrets.GITHUB_TOKEN }}"
                  wait-interval: 60 # seconds
                  running-workflow-name: "Semantic Release" # wait for all other checks to complete
                  allowed-conclusions: "success,skipped,neutral" # all other checks must pass, being skipped or cancelled is not sufficient
                  ignore-checks: "lock-closed / lock-closed, Socket Security: Pull Request Alerts, Dependabot"

            - name: "Git checkout"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
              with:
                  fetch-depth: 0
                  token: "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN }}"
              env:
                  GIT_COMMITTER_NAME: "GitHub Actions Shell"
                  GIT_AUTHOR_NAME: "GitHub Actions Shell"
                  EMAIL: "github-actions[bot]@users.noreply.github.com"

            - name: "Setup resources and environment"
              id: "setup"
              uses: "anolilab/workflows/step/setup@ea8d9012e452bfa5a85447527ba0db24698cafac" # v20.2.7
              with:
                  node-version: "22.x"
                  cache-prefix: "semantic-release"
                  install-node-gyp: "true"

            - name: "Build Production"
              run: "pnpm run build:prod:packages"

            # - name: "test and coverage"
            #  run: "pnpm run test:coverage"
            #  env:
            #      # @TODO: This is used to skip the css test with the production build, till a good solution is found
            #      PACKEM_PRODUCTION_BUILD: "true"

            - name: "Prepare nx cache"
              shell: "bash"
              run: "tar -cf - .nx/cache | lz4 > /tmp/nx_cache.tar.lz4" # compress nx cache

            # - name: "Upload code coverage to codecov"
            #  uses: "anolilab/workflows/step/codecov@d11bc32c7774bbdc35e4f89af140bc49ce4f9f68" # v15.1.1
            #  with:
            #      run-lint: "false"
            #      codecov-token: "${{ secrets.CODECOV_TOKEN }}"

            - name: "Semantic Release"
              if: "success()"
              env:
                  GITHUB_TOKEN: "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN }}"
                  NPM_TOKEN: "${{ secrets.NPM_AUTH_TOKEN }}"
                  GIT_AUTHOR_NAME: "github-actions-shell"
                  GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
                  GIT_COMMITTER_NAME: "github-actions-shell"
                  GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
              run: "pnpm exec multi-semantic-release"

            # multi-semantic-release pushes per-package `chore(release)` commits that
            # bump each package.json (and any cross-package dependency ranges), but
            # @semantic-release/git only stages per-package assets — pnpm-lock.yaml
            # lives at the root and drifts. Frozen-lockfile installs on the next push
            # then fail with ERR_PNPM_OUTDATED_LOCKFILE. Refresh here.
            - name: "Refresh pnpm-lock.yaml against released manifests"
              if: "success()"
              shell: "bash"
              # --no-frozen-lockfile is intentional here: this step exists precisely to
              # regenerate pnpm-lock.yaml after multi-semantic-release bumps versions.
              # --ignore-scripts prevents any postinstall from running with the release
              # token in env — --lockfile-only means no install happens anyway, but
              # belt-and-suspenders for the security scanner.
              run: "pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts"

            - name: "Commit refreshed lockfile"
              if: "success()"
              uses: "stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d" # v7.2.0
              with:
                  commit_author: "github-actions-shell <github-actions[bot]@users.noreply.github.com>"
                  commit_message: "chore(deps): sync pnpm-lock.yaml with released manifests [skip ci]"
                  commit_user_email: "github-actions[bot]@users.noreply.github.com"
                  commit_user_name: "github-actions-shell"
                  file_pattern: "pnpm-lock.yaml"
