name: "Lint"
on: # yamllint disable-line rule:truthy
    pull_request:
        branches: ["main", "alpha"]
    merge_group: # yamllint disable-line rule:empty-values

concurrency:
    group: "${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

permissions: {}
jobs:
    lint:
        permissions:
            contents: "read"
            pull-requests: "read"
        uses: "anolilab/workflows/.github/workflows/lint.yml@1641a17797e6e1dc3eaf9b462c3c0dae91ab071d" # v20.2.12
        with:
            lint_eslint: true
            lint_types: true
            lint_attw: true
            lint_package_json: true
            # `lint:text` no longer dies on an invalid `--parallel` flag, but now that it
            # actually runs it reports 642 pre-existing prose errors (319 auto-fixable)
            # across .github/ and packages/**. Nothing has ever exercised this job, so the
            # backlog has to be cleared before it can gate anything. Re-enable then.
            lint_markdown: false
            lint_yaml: true
            lint_actionlint: true
            lint_rust: false
            node_version: "22"
