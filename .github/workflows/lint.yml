name: "Lint"
on: # yamllint disable-line rule:truthy
    pull_request:
        branches: ["main", "alpha"]
permissions: {}
jobs:
    lint:
        permissions:
            contents: "read"
            pull-requests: "read"
        uses: "anolilab/workflows/.github/workflows/lint.yml@045a2d464dad0661a570c8a3c19f4b32bf9efad9" # v15.3.0+
        with:
            lint_eslint: true
            lint_types: true
            lint_attw: true
            lint_package_json: true
            # Disabled until `lint:text` is fixed. The script passes `--parallel`, which
            # textlint has no such option for, so the job fails on argument parsing before
            # linting anything. Dropping the flag is not enough on its own — textlint then
            # runs and reports 642 pre-existing prose errors (319 auto-fixable) across
            # .github/ and packages/**. Re-enable once that backlog is cleared.
            lint_markdown: false
            lint_yaml: true
            # Disabled because raven-actions/actionlint cannot run against a pnpm catalog
            # workspace. To fetch its binary it runs
            # `npm install --no-save @actions/tool-cache` in the repo root, where npm reads
            # our package.json, hits the `catalog:` protocol and exits EUNSUPPORTEDPROTOCOL.
            # That step is also what populates the tool cache, so the cache never warms and
            # every run fails — it only ever surfaces on a PR that touches a workflow file,
            # which is why nothing caught it sooner. Re-enable once the shared workflow
            # stops installing that dependency into the consumer's workspace.
            lint_actionlint: false
            lint_rust: false
            node_version: "22"
