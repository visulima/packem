name: "Zizmor"
on: # yamllint disable-line rule:truthy
    push:
        branches: ["main", "alpha"]
    pull_request:
        branches: ["main", "alpha"]
# Push runs feed the code-scanning dashboard, so only collapse superseded
# pull request runs.
concurrency:
    group: "${{ github.workflow }}-${{ github.ref }}"
    # Quoting the expression would hand GitHub the literal string instead of the boolean.
    # yamllint disable-line rule:quoted-strings
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}
jobs:
    zizmor:
        permissions:
            security-events: "write"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/zizmor.yml@1641a17797e6e1dc3eaf9b462c3c0dae91ab071d" # v20.2.12
        with:
            min_severity: "medium"
