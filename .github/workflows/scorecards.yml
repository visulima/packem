name: "Scorecards supply-chain security"
on: # yamllint disable-line rule:truthy
    # Only the default branch is supported for the Branch-Protection check, and the
    # trigger takes no configuration.
    branch_protection_rule: # yamllint disable-line rule:empty-values
    schedule:
        - cron: "37 14 * * 6"
    push:
        branches: ["main"]
# Only the newest main scan is meaningful — it is what gets published — so a burst
# of merges collapses to one run instead of queueing one per commit.
concurrency:
    group: "${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

permissions: {}
jobs:
    scorecards:
        permissions:
            security-events: "write"
            id-token: "write"
            actions: "read"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/scorecards.yml@1641a17797e6e1dc3eaf9b462c3c0dae91ab071d" # v20.2.12
        with:
            branch: "main"
            publish_results: true
