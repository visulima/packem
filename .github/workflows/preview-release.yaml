name: "Preview Release"

on: # yamllint disable-line rule:truthy
    # eslint-disable-next-line yml/no-empty-mapping-value
    pull_request: # yamllint disable-line rule:empty-values

# A new push to a pull request supersedes the preview it would have published.
concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
    cancel-in-progress: true

permissions:
    contents: "read" # to fetch code (actions/checkout)

env:
    HEAD_REF: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}"
    HEAD_REPOSITORY: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}"

jobs:
    files-changed:
        name: "Detect what files changed"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 3
        # Map a step output to a job output
        outputs:
            packages: "${{ steps.changes.outputs.packages }}"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2" # v2.22.2
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false
              env:
                  GIT_COMMITTER_NAME: "GitHub Actions Shell"
                  GIT_AUTHOR_NAME: "GitHub Actions Shell"
                  EMAIL: "github-actions[bot]@users.noreply.github.com"

            - name: "Check for file changes"
              uses: "dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d" # v4.0.3
              id: "changes"
              with:
                  token: "${{ github.token }}"
                  filters: ".github/file-filters.yml"

    preview:
        name: "Preview Release"
        if: |
            github.repository == 'visulima/packem' &&
            needs.files-changed.outputs.packages == 'true'
        needs: "files-changed"
        runs-on: "ubuntu-latest"
        permissions:
            contents: "write"
            issues: "write"
            checks: "write"
            pull-requests: "write"

        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2" # v2.22.2
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  # Number of commits to fetch. 0 indicates all history for all branches and tags.
                  # Pulls all commits (needed for `vis affected`)
                  fetch-depth: 0
                  persist-credentials: false
              env:
                  GIT_COMMITTER_NAME: "GitHub Actions Shell"
                  GIT_AUTHOR_NAME: "GitHub Actions Shell"
                  EMAIL: "github-actions[bot]@users.noreply.github.com"

            - name: "Setup resources and environment"
              id: "setup"
              uses: "anolilab/workflows/step/setup@1641a17797e6e1dc3eaf9b462c3c0dae91ab071d" # v20.2.12
              with:
                  # Nothing restores an nx cache any more; vis's task cache is not kept between runs.
                  enable-nx-cache: "false"
                  node-version: "22.x"
                  cache-prefix: "preview-release"
                  install-node-gyp: "true"
                  run-npm-audit: "false"
                  run-signatures-audit: "false"

            # vis resolves the affected base from the GitHub event itself
            # (origin/<base ref> on a pull request, event.before on a push).
            - name: "Build"
              shell: "bash"
              run: "pnpm run build:affected:prod:packages"

            - name: "Preview Release"
              shell: "bash"
              run: "node ./scripts/publish-preview-release.js"
