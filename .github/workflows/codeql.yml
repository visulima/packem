name: "CodeQL"
on: # yamllint disable-line rule:truthy
    push:
        branches: ["main", "alpha"]
    pull_request:
        branches: ["main", "alpha"]
    schedule:
        - cron: "0 0 * * 1"
# Push and schedule runs feed the code-scanning dashboard, so only collapse
# superseded pull request runs.
concurrency:
    group: "${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}
jobs:
    codeql:
        permissions:
            security-events: "write"
            actions: "read"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/codeql.yml@1641a17797e6e1dc3eaf9b462c3c0dae91ab071d" # v20.2.12
        with:
            languages: "[\"javascript-typescript\"]"
            branches: "[\"main\", \"alpha\"]"
