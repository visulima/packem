name: "CodeQL"
on: # yamllint disable-line rule:truthy
    push:
        branches: ["main", "alpha"]
    pull_request:
        branches: ["main", "alpha"]
    schedule:
        - cron: "0 0 * * 1"
# Push and schedule runs feed the code-scanning dashboard, so only collapse
# superseded pull request runs.
concurrency:
    group: "${{ github.workflow }}-${{ github.ref }}"
    # Quoting the expression would hand GitHub the literal string instead of the boolean.
    # yamllint disable-line rule:quoted-strings
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}
jobs:
    codeql:
        permissions:
            security-events: "write"
            actions: "read"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/codeql.yml@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
        with:
            languages: "[\"javascript-typescript\"]"
            branches: "[\"main\", \"alpha\"]"
