name: "Dependency review"
on: # yamllint disable-line rule:truthy
    pull_request:
        branches: ["main", "alpha"]
# Only the newest review of a pull request is meaningful.
concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
    cancel-in-progress: true

permissions: {}
jobs:
    dependency-review:
        permissions:
            contents: "read"
            pull-requests: "write"
        uses: "anolilab/workflows/.github/workflows/dependency-review.yml@c591192cfee03092dfd5e3e2857f1a83b129464b" # v26.0.9
