name: "Dependency review"
on: # yamllint disable-line rule:truthy
    pull_request:
        branches: ["main", "alpha"]
# Only the newest review of a pull request is meaningful.
concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
    cancel-in-progress: true

permissions: {}
jobs:
    dependency-review:
        permissions:
            contents: "read"
            pull-requests: "write"
        uses: "anolilab/workflows/.github/workflows/dependency-review.yml@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
