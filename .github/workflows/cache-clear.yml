name: "Cleanup caches by a branch"

on: # yamllint disable-line rule:truthy
    pull_request:
        types:
            - "closed"
    workflow_dispatch: # yamllint disable-line rule:empty-values

permissions:
    actions: "write" # to delete caches for the merged branch
    contents: "read" # to read the repository

jobs:
    cleanup-branch-cache:
        uses: "anolilab/workflows/.github/workflows/cleanup-branch-cache.yml@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
        with:
            target-repo: "visulima/packem"
