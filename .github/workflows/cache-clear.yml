on: # yamllint disable-line rule:truthy
    pull_request:
        types:
            - "closed"
    workflow_dispatch: # yamllint disable-line rule:empty-values

jobs:
    cleanup-branch-cache:
        uses: "anolilab/workflows/.github/workflows/cleanup-branch-cache.yml@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5
        with:
            target-repo: "visulima/packem"
