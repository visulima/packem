# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "CodSpeed"

on: # yamllint disable-line rule:truthy
    push:
        branches: ["main", "alpha"]
    pull_request:
        types: ["opened", "synchronize", "reopened"]
        branches: ["main", "alpha", "next", "beta"]
    workflow_dispatch: # yamllint disable-line rule:empty-values

concurrency:
    group: "${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

permissions:
    contents: "read" # to fetch code (actions/checkout)

jobs:
    # PR-only gate: a docs-only PR skips the whole install/build/bench job. Push
    # runs are never gated — CodSpeed needs a complete baseline on every branch
    # head to compare later pull requests against.
    files-changed:
        name: "Detect what files changed"
        if: "github.event_name == 'pull_request'"
        runs-on: "ubuntu-latest"
        timeout-minutes: 5
        outputs:
            packages: "${{ steps.changes.outputs.packages }}"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2" # v2.22.2
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false

            - name: "Check for file changes"
              uses: "dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d" # v4.0.3
              id: "changes"
              with:
                  token: "${{ github.token }}"
                  filters: ".github/file-filters.yml"

    # One runner per bench project. Separate runners mean no CPU contention between
    # projects — something a single sequential job cannot promise — and wall-clock
    # becomes the slowest project rather than the sum of all of them.
    discover:
        name: "Discover bench projects"
        # `!cancelled()` rather than the implicit success(): files-changed is skipped
        # on push and workflow_dispatch, which would otherwise skip this job too.
        if: "!cancelled() && (github.event_name != 'pull_request' || needs.files-changed.outputs.packages == 'true')"
        needs: "files-changed"
        runs-on: "ubuntu-latest"
        timeout-minutes: 10
        outputs:
            has-benches: "${{ steps.affected.outputs.has-benches }}"
            matrix: "${{ steps.affected.outputs.matrix }}"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2" # v2.22.2
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  # Full history so `vis affected` can resolve the PR base ref.
                  fetch-depth: 0
                  persist-credentials: false

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/setup@1641a17797e6e1dc3eaf9b462c3c0dae91ab071d" # v20.2.12
              with:
                  # Nothing restores an nx cache any more; vis's task cache is not kept between runs.
                  enable-nx-cache: "false"
                  node-version: "22.x"
                  cache-prefix: "codspeed-discover"
                  run-npm-audit: "false"
                  run-signatures-audit: "false"

            # On a pull request only the benches whose project (or an upstream dependency)
            # changed; on push every bench, so each branch head keeps a complete baseline
            # for later pull requests to compare against.
            - name: "Compute bench projects"
              id: "affected"
              shell: "bash"
              env:
                  EVENT_NAME: "${{ github.event_name }}"
              run: |
                  # Called directly, not through `pnpm exec`, whose banner would corrupt the JSON.
                  vis="./node_modules/.bin/vis"

                  # `benchmarks` owns a test:bench target too, but it is the end-to-end
                  # build comparison: it measures wall-clock, must run sequentially on one
                  # machine, and has nothing for CodSpeed to instrument. The type:package
                  # tag leaves it out.
                  all=$("$vis" action-graph test:bench --json --query "tag=type:package" | jq -c '[.tasks[] | {project: .target.project, root: .projectRoot}]')

                  if [ "$EVENT_NAME" = "pull_request" ]; then
                      roots=$("$vis" affected test:bench --sparse-checkout --query "tag=type:package" | jq -R . | jq -sc .)
                      projects=$(jq -nc --argjson all "$all" --argjson roots "$roots" '[$all[] | select(.root | IN($roots[])) | .project]')
                  else
                      projects=$(echo "$all" | jq -c '[.[].project]')
                  fi

                  if [ "$projects" = "[]" ]; then
                      echo "No affected bench projects."
                      echo "has-benches=false" >> "$GITHUB_OUTPUT"
                      echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  echo "Bench projects: $projects"
                  echo "has-benches=true" >> "$GITHUB_OUTPUT"
                  echo "matrix=$(echo "$projects" | jq -c '{include: [.[] | {project: .}]}')" >> "$GITHUB_OUTPUT"

    benchmark:
        name: "Bench: ${{ matrix.project }}"
        needs: "discover"
        if: "${{ needs.discover.outputs.has-benches == 'true' }}"
        runs-on: "ubuntu-latest"
        # rollup-plugin-dts runs the slowest suite: its "before" cases are O(n^2) /
        # per-resolve tsconfig parses and CodSpeed's simulation mode adds overhead, so
        # the job needs materially more than the old 30 minutes on hosted runners.
        timeout-minutes: 75
        strategy:
            # One project failing should not cancel the rest: a partial set of
            # measurements is still worth uploading.
            fail-fast: false
            matrix: "${{ fromJSON(needs.discover.outputs.matrix) }}"
        # Scope the CodSpeed OIDC token to an environment so secrets and reviewer
        # rules (configured in repo settings) can apply to benchmark uploads.
        environment: "benchmarks"
        permissions:
            contents: "read"
            id-token: "write" # required for OIDC authentication with CodSpeed
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2" # v2.22.2
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  # Full history so `vis affected` can resolve the PR base ref.
                  fetch-depth: 0
                  persist-credentials: false

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/setup@1641a17797e6e1dc3eaf9b462c3c0dae91ab071d" # v20.2.12
              with:
                  # Nothing restores an nx cache any more; vis's task cache is not kept between runs.
                  enable-nx-cache: "false"
                  node-version: "22.x"
                  cache-prefix: "codspeed"
                  install-node-gyp: "true"
                  run-npm-audit: "false"
                  run-signatures-audit: "false"

            # Benches import their package's siblings through the built `dist/`, which is
            # gitignored, so they cannot resolve until the workspace is built.
            - name: "Build packages"
              run: "pnpm run build:prod:packages"

            # `--no-cache` is deliberate: a cache hit would short-circuit the run
            # and hand CodSpeed no measurements at all.
            - name: "Run benchmark"
              env:
                  BENCH_PROJECT: "${{ matrix.project }}"
              uses: "CodSpeedHQ/action@f22792bfac16f3e14eb9fbea76f4a48e9cc22b93" # v4.19.1
              with:
                  mode: "simulation"
                  run: 'pnpm exec vis run test:bench --projects "$BENCH_PROJECT" --no-cache'
