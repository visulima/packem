  # packem itself is a rollup plugin, not a vite consumer — vite gets pulled in transitively.

  allowedVersions:
    # vite 8 not yet in rollup-plugin-import-trace's peer range

    # @anolilab/* configs pin exact prettier/secretlint/textlint; widen to current catalog
