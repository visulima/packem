    "@anolilab/prettier-config>prettier": "^3.8.0"
    "@anolilab/textlint-config>textlint": "^15.5.0"

    # postgraphile stack is pulled in only by packem's externals integration test
    "@dataplan/pg>graphql": "^15.0.0"
    "@dataplan/pg>pg-sql2": "^4.0.0"
    "@sxzz/test-utils>typescript": "^6.0.0"

