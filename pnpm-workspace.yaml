dedupePeerDependents: true
disallowWorkspaceCycles: false

ignoredOptionalDependencies:
  - fsevents
  - dtrace-provider
linkWorkspacePackages: true

minimumReleaseAgeExclude:
  # Standing exemptions. These are name patterns (not version pins), so they never
  # need re-adding as new versions publish. Everything the team tracks closely and
  # trusts to adopt immediately lives here; renovate-added per-version pins do not.
  - vitest
  - "@vitest/*"
  - typescript
  - "@types/*"
  - "@rolldown/*"
  - svelte
  # oxc and yuku publish very frequently (every renovate bump ships a new set of
  # per-platform native bindings) and are core to the dts pipeline, so exempt the
  # whole families by name rather than re-pinning each binding version.
  - oxc-parser
  - oxc-transform
  - "@oxc-parser/*"
  - "@oxc-transform/*"
  - "@oxc-project/*"
  - yuku-parser
  - yuku-codegen
  - "@yuku-parser/*"
  - "@yuku-codegen/*"

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - "@tailwindcss/oxide"
  - esbuild
  - less
  - node-sass
  - nodehun
  - nx
  - oxc-resolver
  - rs-module-lexer
  - unrs-resolver
